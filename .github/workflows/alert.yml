name: 株価アラート監視

on:
  schedule:
    # 平日、日本時間の取引時間帯を5分ごとに監視する。
    # GitHub ActionsのcronはUTC。0-6時UTC = 日本時間9:00-15:59。
    # 実際の取引時間外判定はalert.py側でJSTにて行う。
    - cron: '*/5 0,1,2,3,4,5,6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kabu-alert-monitor
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: ライブラリインストール
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: アラート実行
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TZ: Asia/Tokyo
        run: python alert.py

      - name: 通知済み状態を保存（重複通知防止）
        run: |
          if [ -n "$(git status --porcelain alert_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alert_state.json
            git commit -m "通知状態を更新 $(TZ=Asia/Tokyo date +'%Y/%m/%d %H:%M')"
            git push
          else
            echo "変更なし（コミット不要）"
          fi
