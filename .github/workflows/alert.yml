name: 株価アラート監視

on:
  schedule:
    # 平日、日本時間の取引時間帯を5分ごとに監視する。
    # GitHub ActionsのcronはUTC。0-6時UTC = 日本時間9:00-15:59。
    # 実際の取引時間外判定はalert.py側でJSTにて行う。
    - cron: '*/5 0,1,2,3,4,5,6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kabu-alert-monitor
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python設定
        uses: actions/setup-python@v5